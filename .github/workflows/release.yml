name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: iecli-linux-x86_64
            binary_path: target/release/iecli
            archive: iecli-linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: iecli-windows-x86_64
            binary_path: target/release/iecli.exe
            archive: iecli-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp ${{ matrix.binary_path }} dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item ${{ matrix.binary_path }} dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pull this tag's section out of CHANGELOG.md. Releases shipped with empty
      # notes before this, which left the binaries with nothing saying what they
      # contained.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            collecting && /^## \[/ { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "no CHANGELOG.md section for [$version]" >&2
            exit 1
          fi

      # A tag like v0.3.0-rc.1 must not become the "Latest" release that people
      # land on. Semver says a hyphen marks a pre-release, so key off that.
      - name: Classify release
        id: classify
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          prerelease: ${{ steps.classify.outputs.prerelease }}

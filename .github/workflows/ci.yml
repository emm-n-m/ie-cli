name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  skills:
    name: skill parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Claude mirror matches canonical skills/
        run: python scripts/skill_parity.py --check
      - name: Skill helpers are importable
        run: |
          for script in skills/*/scripts/*.py; do
            python "$script" --help > /dev/null
          done

  ci:
    name: CI
    needs: [test, skills]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify upstream jobs succeeded
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "matrix job result: ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.skills.result }}" != "success" ]]; then
            echo "skill parity job result: ${{ needs.skills.result }}"
            exit 1
          fi
